[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-agent"
version = "1.0.0"
description = "M.I.R.A. — Market Intelligence & Research Agent (CLI + API)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ahmed El Zainy" }]
keywords = ["finance", "ai", "agent", "fastapi", "cli", "investment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]
# Runtime dependencies are pinned in requirements.txt; mirror only the CLI
# essentials here so `pip install .` gives you a working command-line tool
# even without installing the heavy ML stack.
dependencies = [
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "httpx>=0.27,<1",
    "redis>=5,<6",
    "python-dotenv>=1,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
full = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "yfinance==0.2.38",
    "pandas==2.2.2",
    "numpy<2",
    "transformers==4.41.0",
    "torch==2.3.0",
    "sentencepiece==0.2.0",
    "tiktoken==0.7.0",
    "schedule==1.2.2",
    "openai==1.30.1",
    "requests==2.32.2",
    "anyio==4.4.0",
]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.7",
    "ruff>=0.4",
]

[project.scripts]
mira = "cli:main"

[project.urls]
Homepage = "https://github.com/Ahmed-El-Zainy/mira"
Repository = "https://github.com/Ahmed-El-Zainy/mira"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["agent*", "api*", "monitoring*", "storage*", "tools*", "utils*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
